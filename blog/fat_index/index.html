0_at_7_36_50_PM_d469866dff.png",hash:"thumbnail_Screenshot_2024_03_20_at_7_36_50_PM_d469866dff",mime:"image\u002Fpng",name:"thumbnail_Screenshot 2024-03-20 at 7.36.50 PM.png",path:null,size:33.27,width:156,height:156}},hash:"Screenshot_2024_03_20_at_7_36_50_PM_d469866dff",ext:".png",mime:"image\u002Fpng",size:472.72,url:"https:\u002F\u002Fempowerhk.s3.ap-southeast-1.amazonaws.com\u002FScreenshot_2024_03_20_at_7_36_50_PM_d469866dff.png",previewUrl:null,provider:"aws-s3",provider_metadata:null,createdAt:"2024-03-21T09:05:52.592Z",updatedAt:"2024-03-21T09:05:52.592Z"}}},related_posts:{data:[{id:216,attributes:{title:"“被運動”，有效用？（上篇）",excerpt:null,content:"\n\n上星期討論了做運動減肥，今次我們來了解“被運動”的成效😉。\n\n“被動式運動”，指的是“做機減肥”，近年以冷凍溶脂最為人談論。相比傳統抽脂，冷凍浴脂不用麻醉，痛楚程度大減且修復快。冷凍溶脂據稱獲美國食品及藥物管理局(FDA)認證，可以在60分鐘療程內，把脂肪冷卻在攝氏5度低溫，從而令脂肪細胞提早老化，隨新陳代謝排出體外。\n\n須注意的是，FDA認可只反映儀器本身的安全性，不代表人人都適合做，而且操作者的技術也很重要，溫度、探頭大小、位置等皆影響安全性及效果。此外，冷凍溶脂被稱為“體型雕塑”，不是減肥；外國研究發現接受了兩次冷凍溶脂的人士，脂肪層厚度每次平均減少約20%，但體重只減去0.2公斤。故此冷凍溶脂通常只用以修線條，不能減磅，對健康狀況的改善作用也不大。\n\n冷凍令組織內缺氧缺血，的確可以造成脂肪細胞破壞。但如何令低溫到達脂肪層的同時，不讓皮膚溫度下降太多致皮膚凍傷😖？又如何確保低溫到達脂肪層後，不會傷及附近的血管、神經及肌肉？有報章曾就冷凍溶脂技術訪問香港醫學會前會長謝鴻興醫生，他指若皮膚細胞同時被冷凍，有機會產生疤痕甚至壞死。皮膚科醫生史泰祖則表示：“如果得，自己去雪地坐下，又會唔會瘦咗呢？”\n\n即使冷凍溶脂及抽脂手術可以減少脂肪細胞數量，但無法防止脂肪細胞增大，所以療程後不控制飲食和運動，不久就會復胖。",slug:"passive-exercise-210730",createdAt:"2021-07-30T00:00:00.000Z",updatedAt:"2021-07-30T00:00:00.000Z"}},{id:233,attributes:{title:"代謝綜合症 身體響警號",excerpt:null,content:"\n\n代謝綜合症是由中央肥胖引致的多個高風險致病因素的統稱，在香港愈見普遍😧。當脂肪積存於皮下或腹腔，直接或間接影響肝臟、胰臟及腎臟的荷爾蒙平衡，造成高血壓、高血糖等健康問題。\n\n血壓是指血液由心臟送出時，在動脈血管內產生的壓力。收縮期血壓俗稱「上壓」，舒張期血壓俗稱「下壓」，上壓140或以上，下壓90或以上即為高血壓。不受控制的高血壓有機會令血管壁變薄並膨脹，形成動脈瘤，動脈瘤破裂可致命☠️。若腦部的動脈瘤破裂，可引致中風；不受控制的高血壓也可令頸動脈產生血塊，如血塊流入腦部，可致栓塞性中風。\n\n要了解高血糖，必須先認識胰島素。胰島素為體內荷爾蒙，由胰臟細胞分泌；主要作用為促進血液內的葡萄糖輸入肝臟、肌肉和脂肪細胞，產生能量。胰島素分泌不足，或對胰島素功能產生抗拒，血液內的葡萄糖便不能進入細胞，導致血糖上升，並由小便排出，造成糖尿病。\n\nHbA1c 糖化血紅素反映身體過去2至3個月的平均血糖值，所以較檢驗空腹血糖為準確。根據英國糖尿研究報告（UKPDS），HbA1c每下降1%，即可減低糖尿併發症的傷害。\n\n代謝綜合症在香港愈發普遍，原因之一，是港人常外出用膳。碟頭飯1碟相當於2至3碗飯量，即使男士也可選擇減飯，並配以大碟蔬菜🥗，以增加纖維量和飽腹感；黑椒汁、洋葱汁、白汁、肉醬含極高卡路里，例如🍝肉醬意粉的肉醬汁達750卡路里，相當於3碗白飯的熱量😱，可要求餐廳將飯餸分開，自己調節加入多少醬汁。\n\n此外，根據衛生署衛生防護中心統計，90%香港人的平均每日蔬果攝取量未達世界衛生組織建議攝取量（5份蔬果）的一半🫣，而且攝取種類單一，情況令人關注。\n\n如欲了解如何有效減肥瘦身，以至逆轉糖尿，歡迎參與逢星期一晚上8:30舉行的《營養讀書會》🤗，詳情請私訊我們查詢。",slug:"metabolic-syndrome-220701",createdAt:"2022-07-01T00:00:00.000Z",updatedAt:"2022-07-01T00:00:00.000Z"}},{id:190,attributes:{title:"兒童肥胖\u002F瘦削，如何調整營養攝取？",excerpt:null,content:"\n\n兒童無論肥胖或瘦削，都與宏量營養素即蛋白質、脂肪及碳水化合物的攝入不合標準相關。這必須透過調整飲食結構去扭轉，不能單純壓縮或拼命增加能量的攝入😉。\n\n調整飲食結構，就要調整三大宏量營養素的攝入：想令肥胖的孩子脂肪降低，就要減少其對脂肪和碳水化合物的攝取，加強蛋白質的攝入；對於瘦削的孩子，要令他不能太挑食或偏食，另外也需要提供更多蛋白質，來促進身體的生長與發育。由此可見，蛋白質的補充對兒童非常重要！💪🏻💪🏻\n\n成長階段的嬰幼兒、兒童及青少年，身體各項組織、機能正在發展，對蛋白質的需求量大增。一般建議：\u003Cbr\u003E\n嬰幼兒時期的蛋白質攝取量為體重（公斤）Ｘ1.4（克）\u003Cbr\u003E\n兒童、青少年的蛋日質攝取量為體重（公斤）Ｘ1.2~1.4（克）\n\n舉例而言，若兒童的體重為40公斤，每日約需要48至56克的蛋白質；然而，兒童的胃容量只有成年男士的1\u002F6，但每日所需的蛋白質可媲美成年男性😱，那如何是好？\n\n家長應讓孩子2\u002F3的蛋白質攝取量為容易消化吸收的蛋白質，例如雞蛋、魚，以及豆漿和全植物蛋白質粉等植物性蛋白質，並少食多餐😉。",slug:"post201101",createdAt:"2020-11-01T00:00:00.000Z",updatedAt:"2020-11-01T00:00:00.000Z"}}]}}},uses:{dependencies:["http://127.0.0.1:1337/api/posts?populate[author]=true&populate[categories]=true&populate[tags]=true&populate[image]=true&populate[related_posts]=true&filters[slug][$eq]=fat_index"],params:["slug"]}}],
